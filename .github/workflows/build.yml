name: Compilar SeriesFlix
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudstream-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilación
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson ensureJarCompatibility
      - name: Preparar distribución
        run: |
          mkdir -p dist
          cp SeriesFlix/build/*.cs3 dist/
          cp SeriesFlix/build/SeriesFlix.jar dist/ 2>/dev/null || true
          cp build/plugins.json dist/
          cp repo.json dist/
          test -s dist/plugins.json
          test -s dist/repo.json
          test -s dist/SeriesFlix.cs3
      - uses: actions/upload-artifact@v4
        with:
          name: seriesflix-cloudstream
          path: dist/
      - name: Publicar rama builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin builds || true
          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add publication origin/builds
            git -C publication checkout -B builds origin/builds
          else
            git worktree add --detach publication
            git -C publication checkout --orphan builds
            git -C publication rm -rf . || true
          fi
          git -C publication ls-files -z | xargs -0 -r -I '{}' rm -f -- "publication/{}"
          cp dist/* publication/
          git -C publication config user.name "github-actions[bot]"
          git -C publication config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publication add -A
          git -C publication commit -m "Compilación automática" || exit 0
          git -C publication push origin HEAD:builds
